<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure & Elegant Login</title>
    <!-- Content Security Policy to prevent XSS and data injection -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Anti-clickjacking -->
    <style id="antiClickjack">
        body {
            display: none !important;
        }
    </style>
    <script>
        if (self === top) {
            var antiClickjack = document.getElementById("antiClickjack");
            antiClickjack.parentNode.removeChild(antiClickjack);
        } else {
            top.location = self.location;
        }
    </script>

    <div class="background-elements">
        <canvas id="bgCanvas"></canvas>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <canvas id="headerCanvasLogo" width="100" height="100"></canvas>
            <h2>Bienvenido novato</h2>
            <p>Ingresa tus credenciales de forma segura</p>
        </div>

        <form id="secureLoginForm" novalidate>
            <!-- Honeypot field for bot detection -->
            <input type="text" name="website_url" id="website_url" class="honeypot" tabindex="-1" autocomplete="off">

            <!-- CSRF Token (simulated) -->
            <input type="hidden" id="csrf_token" name="csrf_token" value="abc123_secure_token_xyz890">

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required autocomplete="off" placeholder="tu@correo.com"
                    maxlength="50">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="off"
                        placeholder="••••••••" maxlength="64">
                    <button type="button" id="togglePassword" class="toggle-btn" tabindex="-1"
                        aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="feather feather-eye">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <span class="error-message" id="passwordError"></span>
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span class="btn-text">Iniciar Sesión</span>
                <div class="loader" id="btnLoader"></div>
            </button>

            <div id="formFeedback" class="form-feedback"></div>
        </form>
    </div>

    <div id="aiLogo" class="ai-logo">
        <div class="core"></div>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
    </div>

    <script src="app.js"></script>
</body>
<!-- made josseth -->

</html>
