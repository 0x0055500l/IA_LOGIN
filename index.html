<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure & Elegant Login — Sistema Experto IA</title>
    <meta name="description" content="Inicio de sesión seguro con validación inteligente, motor de inferencia y verificación antifraude basada en IA.">
    <!-- Content Security Policy to prevent XSS and data injection -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' http://localhost:3000;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Anti-clickjacking -->
    <style id="antiClickjack">
        body {
            display: none !important;
        }
    </style>
    <script>
        if (self === top) {
            var antiClickjack = document.getElementById("antiClickjack");
            antiClickjack.parentNode.removeChild(antiClickjack);
        } else {
            top.location = self.location;
        }
    </script>

    <div class="background-elements">
        <canvas id="bgCanvas"></canvas>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <canvas id="headerCanvasLogo" width="100" height="100"></canvas>
            <h1 data-i18n="login_welcome">Bienvenido</h1>
            <p data-i18n="login_subtitle">Ingresa tus credenciales de forma segura</p>
        </div>

        <form id="secureLoginForm" novalidate>
            <!-- Honeypot field for bot detection -->
            <input type="text" name="website_url" id="website_url" class="honeypot" tabindex="-1" autocomplete="off">

            <!-- CSRF Token (will be generated dynamically by server) -->
            <input type="hidden" id="csrf_token" name="csrf_token" value="">

            <div class="input-group">
                <label for="email" data-i18n="login_email">Correo Electrónico</label>
                <div class="input-wrapper" style="position: relative;">
                    <input type="email" id="email" name="email" required autocomplete="off" placeholder="tu@correo.com.hn"
                        maxlength="60">
                    <div class="mini-loader" id="emailLoader"></div>
                </div>
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="input-group">
                <label for="phone" data-i18n="login_phone">Número Telefónico</label>
                <div class="input-wrapper" style="position: relative; width: 100%;">
                    <input type="tel" id="phone" name="phone" required autocomplete="off">
                </div>
                <span class="error-message" id="phoneError"></span>
            </div>

            <div class="input-group">
                <label for="password" data-i18n="login_password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="off"
                        placeholder="••••••••" maxlength="64">
                    <button type="button" id="togglePassword" class="toggle-btn" tabindex="-1"
                        aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="feather feather-eye">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <span class="error-message" id="passwordError"></span>
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span class="btn-text" data-i18n="login_submit">Iniciar Sesión</span>
                <div class="loader" id="btnLoader"></div>
            </button>

            <div id="formFeedback" class="form-feedback"></div>
        </form>

        <!-- Antifraude Panel — OUTSIDE the login form, collapsible -->
        <div class="fraud-section">
            <button type="button" id="fraudToggleBtn" class="fraud-toggle-btn">
                <span data-i18n="fraud_toggle_btn">🛡️ Verificación Antifraude</span>
                <span class="toggle-icon">▼</span>
            </button>
            <div id="fraudPanelWrapper" class="fraud-panel-wrapper">
                <div class="risk-panel">
                    <div class="risk-panel-header">
                        <h3 data-i18n="fraud_title">Motor de Inferencia Antifraude</h3>
                        <p data-i18n="fraud_desc">Analiza la transacción ficticia con cámara y reglas expertas.</p>
                    </div>

                    <div class="transaction-grid">
                        <div class="input-group compact">
                            <label for="amount" data-i18n="fraud_amount">Monto</label>
                            <input type="number" id="amount" name="amount" min="1" value="4200">
                        </div>
                        <div class="input-group compact">
                            <label for="transactionHour" data-i18n="fraud_hour">Hora</label>
                            <input type="time" id="transactionHour" name="transactionHour" value="23:30">
                        </div>
                    </div>

                    <div class="transaction-grid">
                        <div class="input-group compact">
                            <label for="location" data-i18n="fraud_loc">Ubicación actual</label>
                            <input type="text" id="location" name="location" value="Tegucigalpa">
                        </div>
                        <div class="input-group compact">
                            <label for="lastLocation" data-i18n="fraud_last_loc">Última compra</label>
                            <input type="text" id="lastLocation" name="lastLocation" value="San Pedro Sula">
                        </div>
                    </div>

                    <div class="camera-card">
                        <video id="faceVideo" autoplay playsinline muted></video>
                        <button type="button" id="scanFaceBtn" class="scan-btn" data-i18n="fraud_scan">Escanear Rostro</button>
                        <div id="cameraStatus" class="camera-status" data-i18n="camera_ready">Listo para activar la cámara.</div>
                        <canvas id="captureCanvas" hidden></canvas>
                    </div>

                    <div id="riskSummary" class="risk-summary" data-i18n="risk_waiting">Esperando evaluación del riesgo…</div>
                </div>
            </div>
        </div>
    </div>

    <div id="aiLogo" class="ai-logo">
        <div class="core"></div>
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <script src="reglas.js"></script>
    <script src="motorInferencia.js"></script>
    <script src="app.js"></script>
</body>
<!-- made josseth -->

</html>
